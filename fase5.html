    <h2>Fase 5: Cierre del Proceso y Acreditación</h2>
    <p>Has completado todas las etapas de la ruta de autoformación digital de Estadística Descriptiva. Ingresa tus datos para generar tu constancia institucional:</p>

    <!-- Contenedor del formulario separado -->
    <div class="diploma-form-container" style="margin-top: 20px; background: #EAFBFF; padding: 20px; border-radius: 8px;">
      <label for="nombreAlumno"><strong>Nombre Completo:</strong></label><br>
      <input type="text" id="nombreAlumno" style="width: 100%; padding: 10px; margin: 8px 0 15px 0; border: 1px solid #75D7F5; border-radius: 5px;" placeholder="Ej. Jaqueline Vanessa Estrada Chegüén"><br>
      
      <label for="carneAlumno"><strong>Número de Carné Académico:</strong></label><br>
      <input type="text" id="carneAlumno" style="width: 100%; padding: 10px; margin: 8px 0 15px 0; border: 1px solid #75D7F5; border-radius: 5px;" placeholder="Ej. 201844305">
      
      <button class="btn-completar" onclick="generarDiploma()">Generar Constancia Oficial</button>
    </div>

    <!-- Aquí se inyecta únicamente el diploma -->
    <div id="diplomaResultado"></div>

      <button class="btn-descargar" onclick="descargarRecursos('Fase 5 - Evaluación')">Descargar Recursos Globales</button>
